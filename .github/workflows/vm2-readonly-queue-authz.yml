name: VM2 Readonly GHA Queue Authz 0916
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Prove GitHub token repository permissions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}" \
          | jq '{full_name,permissions:{admin:.permissions.admin,push:.permissions.push,pull:.permissions.pull}}'
      - name: Mergify queue authz discriminator
        env:
          MERGIFY_GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          base="https://api.mergify.com/v1/repos/${GITHUB_REPOSITORY}/merge-queue/pause"
          get_code=$(curl -sS -o /tmp/get.json -w '%{http_code}' -H "Authorization: Bearer $MERGIFY_GITHUB_TOKEN" "$base")
          put_code=$(curl -sS -o /tmp/put.json -w '%{http_code}' -X PUT \
            -H "Authorization: Bearer $MERGIFY_GITHUB_TOKEN" \
            -H 'Content-Type: application/json' \
            --data '{"reason":"VM2 readonly GHA token queue authz discriminator"}' \
            "$base")
          echo "VM2_QUEUE_GET_STATUS=$get_code"
          echo "VM2_QUEUE_PUT_STATUS=$put_code"
          jq -c '{detail,message,error_code,reason,paused_at}' /tmp/get.json 2>/dev/null || true
          jq -c '{detail,message,error_code,reason,paused_at}' /tmp/put.json 2>/dev/null || true
