name: VM2 Readonly GHA Scopes Authz 0916
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Prove GitHub token repository permissions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}" \
          | jq '{full_name,permissions:{admin:.permissions.admin,push:.permissions.push,pull:.permissions.pull}}'
      - name: Current-SHA scopes write discriminator
        env:
          M_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          url="https://api.mergify.com/v1/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/scopes"
          code=$(curl -sS -o /tmp/scopes.json -w '%{http_code}' -X PUT \
            -H "Authorization: Bearer $M_TOKEN" \
            -H 'Content-Type: application/json' \
            --data '{"scopes":["vm2-readonly-gha-current-control-20260916"],"all_scopes":false}' \
            "$url")
          echo "VM2_SCOPES_CURRENT_STATUS=$code"
          cat /tmp/scopes.json || true
